<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PixiJS Safari 15 Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font: 14px/1.4 system-ui, sans-serif; }
  #app { position: absolute; inset: 0; }
  #status {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 8px 12px; background: rgba(0,0,0,0.72);
    white-space: pre-wrap; pointer-events: none;
    font-family: ui-monospace, monospace; font-size: 12px;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="status">loading pixi.js…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
<script>
const status = document.getElementById('status')
const lines = []
function log(msg) { lines.push(msg); status.textContent = lines.join('\n') }

log('dpr: ' + (window.devicePixelRatio || 1))
log('inner: ' + window.innerWidth + 'x' + window.innerHeight)
log('visibilityState: ' + document.visibilityState)

if (typeof PIXI === 'undefined') {
  log('PIXI load FAILED (CDN block)')
  throw new Error('PIXI not defined')
}

try {
  const app = new PIXI.Application({
    width: window.innerWidth,
    height: window.innerHeight,
    backgroundColor: 0x303030,
    antialias: true,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true,
  })
  document.getElementById('app').appendChild(app.view)

  const type = app.renderer.type
  const typeName = type === PIXI.RENDERER_TYPE.WEBGL
    ? (app.renderer.context.webGLVersion === 2 ? 'WebGL2' : 'WebGL1')
    : type === PIXI.RENDERER_TYPE.CANVAS ? 'Canvas2D (WebGL tắt)' : 'unknown'
  log('PIXI renderer: ' + typeName)

  const stage = new PIXI.Container()
  app.stage.addChild(stage)

  // key columns (1 octave = 7 white keys)
  const keyW = app.screen.width / 7
  const keyboardH = 110
  const rollH = app.screen.height - keyboardH
  const hitY = rollH

  const whiteGfx = new PIXI.Graphics()
  for (let i = 0; i < 7; i++) {
    whiteGfx.beginFill(0xffffff)
    whiteGfx.drawRect(i * keyW, rollH, keyW - 1, keyboardH)
    whiteGfx.endFill()
  }
  stage.addChild(whiteGfx)

  const blackGfx = new PIXI.Graphics()
  blackGfx.beginFill(0x111111)
  const blackCols = [1, 2, 4, 5, 6]
  for (const i of blackCols) {
    blackGfx.drawRect(i * keyW - keyW * 0.3, rollH, keyW * 0.6, keyboardH * 0.62)
  }
  blackGfx.endFill()
  stage.addChild(blackGfx)

  // hit line
  const hitLine = new PIXI.Graphics()
  hitLine.beginFill(0xe01b24)
  hitLine.drawRect(0, hitY - 3, app.screen.width, 6)
  hitLine.endFill()
  stage.addChild(hitLine)

  // grid
  const grid = new PIXI.Graphics()
  grid.lineStyle(1, 0x444444, 0.6)
  for (let i = 0; i <= 7; i++) {
    grid.moveTo(i * keyW, 0)
    grid.lineTo(i * keyW, rollH)
  }
  stage.addChild(grid)

  // falling notes
  const notes = new PIXI.Container()
  stage.addChild(notes)

  const COLORS = [0x3b82f6, 0x22c55e, 0xfacc15, 0xa855f7, 0xef4444]
  const fallSpeed = 0.25 // px per ms

  function spawn() {
    const col = Math.floor(Math.random() * 7)
    const n = new PIXI.Graphics()
    n.beginFill(COLORS[(Math.random() * COLORS.length) | 0])
    n.drawRoundedRect(0, 0, keyW - 6, 28, 6)
    n.endFill()
    n.x = col * keyW + 3
    n.y = -30
    notes.addChild(n)
  }

  app.ticker.add(() => {
    const dt = app.ticker.deltaMS
    for (let i = notes.children.length - 1; i >= 0; i--) {
      const n = notes.children[i]
      n.y += fallSpeed * dt
      if (n.y > rollH) { n.destroy(); notes.removeChildAt(i) }
    }
    if (Math.random() < 0.12) spawn()
  })

  for (let i = 0; i < 10; i++) spawn()

  window.__pixiApp = app
  log('PIXI OK — nốt đang rơi, keyboard + hit line vẽ bằng ' + typeName)
  log('Thấy nốt rơi => PixiJS chạy được trên Safari này')
} catch (e) {
  log('PIXI ERROR: ' + (e && e.message ? e.message : e))
}
</script>
</body>
</html>
