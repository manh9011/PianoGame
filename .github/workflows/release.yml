      - name: Build Android APK
        if: matrix.kind == 'android'
        run: npm run tauri:android:build

      - name: Sign Android release APKs
        if: matrix.kind == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          required_vars=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "Missing GitHub secret: ${var_name}" >&2
              exit 1
            fi
          done

          keystore_path="${RUNNER_TEMP}/pianogame-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"

          shopt -s globstar nullglob
          release_apks=()
          for apk in src-tauri/gen/android/app/build/outputs/apk/**/*.apk; do
            if [[ "$apk" == *release* && "$apk" != *debug* ]]; then
              release_apks+=("$apk")
            fi
          done

          if [ ${#release_apks[@]} -eq 0 ]; then
            echo "No release APK found under src-tauri/gen/android/app/build/outputs/apk" >&2
            exit 1
          fi

          mkdir -p release-assets
          index=1
          for apk in "${release_apks[@]}"; do
            abi="apk-${index}"
            if [[ "$apk" == *aarch64* || "$apk" == *arm64* ]]; then
              abi="arm64-v8a"
            elif [[ "$apk" == *x86_64* ]]; then
              abi="x86_64"
            fi

            aligned_apk="${RUNNER_TEMP}/PianoGame-${RELEASE_TAG}-android-${abi}-release-aligned.apk"
            signed_apk="release-assets/PianoGame-${RELEASE_TAG}-android-${abi}-release-signed.apk"

            "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign" -p -f 4 "$apk" "$aligned_apk"
            "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" sign \
              --ks "$keystore_path" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
              --out "$signed_apk" \
              "$aligned_apk"
            "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "$signed_apk"
            index=$((index + 1))
          done

          ls -la release-assets

      - name: Upload Android APK artifact
        if: matrix.kind == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: PianoGame-${{ env.RELEASE_TAG }}-android-release-signed
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Upload Android APK to GitHub Release
        if: matrix.kind == 'android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "PianoGame ${RELEASE_TAG}" \
              --notes 'Download the installation file compatible with your operating system from the Assets section.' \
              ${{ contains(env.RELEASE_TAG, '-') && '--prerelease' || '' }}
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.apk --clobber
