name: Release Tauri App (Orchestrator)

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to release, e.g., v0.1.0 or v0.1.0-rc.1'
        required: true
        type: string

jobs:
  release-windows:
    uses: ./.github/workflows/release-windows.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    secrets: inherit

  release-macos:
    uses: ./.github/workflows/release-macos.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    secrets: inherit

  release-linux:
    uses: ./.github/workflows/release-linux.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    secrets: inherit

  release-android-arm64-v8a:
    uses: ./.github/workflows/release-android-arm64-v8a.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    secrets: inherit

  release-android-armeabi-v7a:
    uses: ./.github/workflows/release-android-armeabi-v7a.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    secrets: inherit

  release-android-x86_64:
    uses: ./.github/workflows/release-android-x86_64.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    secrets: inherit

  release-android-x86:
    uses: ./.github/workflows/release-android-x86.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    secrets: inherit
